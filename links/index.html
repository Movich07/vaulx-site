<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--panel:#141416;--line:#2a2a2e;--bur:#8e1b30;--bur-l:#b23a50;--text:#f4f4f5;--muted:#a1a1a8}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#241017 0%,var(--bg) 55%);color:var(--text);font-family:Poppins,system-ui,sans-serif;display:flex;justify-content:center;padding:40px 16px}
main{width:100%;max-width:440px;text-align:center}
.logo{width:min(300px,80%);height:auto;margin:0 auto 18px;display:block}
h1{font-family:'Bodoni Moda',serif;font-weight:700;font-size:1.5rem;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.9rem;margin:6px 0 28px}
.links{display:grid;gap:12px}
a.btn{display:flex;align-items:center;gap:14px;padding:15px 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);text-decoration:none;font-weight:500;text-align:left;transition:transform .15s,border-color .15s,background .15s}
a.btn:hover,a.btn:focus-visible{transform:translateY(-2px);border-color:var(--bur-l);background:#1b1215;outline:none}
.ic{flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a42a40,#5b0d1b);display:grid;place-items:center}
.ic svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic svg.fill{fill:#fff;stroke:none}
.t small{display:block;color:var(--muted);font-weight:300;font-size:.78rem}
.tag{margin-top:30px;color:var(--muted);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
