<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You | VAULX</title>
<meta name="robots" content="noindex">
<style>
  :root{ --bg-dark:#170A0D; --cream:#F5EFE2; --burgundy:#8B1235; --gold-bright:#D58CA0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:'Poppins', Arial, sans-serif;
    background:var(--bg-dark); color:var(--cream);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; text-align:center;
  }
  .wrap{ max-width:520px; }
  img.logo{ height:48px; width:auto; margin:0 auto 40px; display:block; }
  .tick{ font-size:3.5rem; color:var(--gold-bright); line-height:1; margin-bottom:12px; }
  h1{ font-size:clamp(1.5rem,3.5vw,2rem); font-weight:700; margin-bottom:14px; }
  p{ color:rgba(245,239,226,0.72); font-size:1rem; line-height:1.6; margin-bottom:32px; }
  .btn{
    display:inline-block; background:var(--burgundy); color:var(--cream);
    padding:14px 32px; border-radius:999px; font-weight:700; text-decoration:none;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .btn:hover{ transform:translateY(-2px); box-shadow:0 10px 24px rgba(139,18,53,0.35); }
  :focus-visible{ outline:2px solid var(--gold-bright); outline-offset:3px; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="/images/logo-nav.png" alt="VAULX" width="893" height="156">
    <div class="tick" aria-hidden="true">✓</div>
    <h1>Thank you, we got it.</h1>
    <p>Your message has been sent. We will get back to you shortly. For anything urgent, message us on WhatsApp.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</body>
