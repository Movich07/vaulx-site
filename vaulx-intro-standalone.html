<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAULX — Cinematic Intro (standalone)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:        #C6A15B;
    --gold-bright: #DBC084;
    --burgundy:    #6B2233;
    --ink:         #1C0E12;
    --cream-faint: rgba(245,239,226,0.42);
    --line-dark:   rgba(198,161,91,0.25);
    --radius-pill: 999px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Poppins', sans-serif; }

  /* ===================================================================
     VAULX CINEMATIC INTRO — standalone, drop-in component
     Real logo only (no reconstructed lettering). Pure CSS animation,
     sequenced with animation-delay. Skippable + reduced-motion safe.

     HOW TO USE IN YOUR OWN PROJECT:
     1. Paste the <div class="intro-overlay">...</div> block as the very
        first thing inside <body>.
     2. Paste this whole <style> block into your site's CSS (or keep it
        inline like here).
     3. Paste the <script> block at the very end of <body>.
     4. Swap the base64 data URI below for your own logo file, or point
        the <img> src at a real file path instead (e.g. "/img/logo.png").
     =================================================================== */
  html.intro-lock, html.intro-lock body{ overflow:hidden; height:100%; }

  .intro-overlay{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #2A1015 0%, #0D0507 78%);
    overflow:hidden;
    animation:introExit 550ms ease-in 2650ms forwards;
  }
  @keyframes introExit{
    0%{ opacity:1; visibility:visible; pointer-events:auto; }
    99%{ pointer-events:none; }
    100%{ opacity:0; visibility:hidden; pointer-events:none; }
  }

  .intro-glow{
    position:absolute; width:60vmax; height:60vmax; border-radius:50%;
    background:radial-gradient(circle, rgba(198,161,91,0.28) 0%, rgba(198,161,91,0) 70%);
    animation:introGlowPulse 3s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes introGlowPulse{ from{opacity:0.5; transform:scale(0.94);} to{opacity:0.9; transform:scale(1.04);} }

  /* The mark itself — ONLY the real logo image, nothing reconstructed */
  .intro-mark{
    position:relative;
    width:clamp(260px, 50vw, 520px);
    animation:introMarkPulse 420ms ease-out 1750ms both;
  }
  .intro-mark img{
    display:block; width:100%; height:auto;
    filter:blur(10px) drop-shadow(0 0 0 rgba(198,161,91,0));
    clip-path:inset(0 100% 0 0);
    animation:introReveal 900ms cubic-bezier(.22,.9,.32,1) 250ms forwards;
  }
  @keyframes introReveal{
    0%{ clip-path:inset(0 100% 0 0); filter:blur(10px); transform:scale(0.97); }
    100%{ clip-path:inset(0 0% 0 0); filter:blur(0) drop-shadow(0 0 0 rgba(198,161,91,0)); transform:scale(1); }
  }
  @keyframes introMarkPulse{
    0%{ transform:scale(1); filter:drop-shadow(0 0 0 rgba(198,161,91,0)); }
    55%{ transform:scale(1.045); filter:drop-shadow(0 0 22px rgba(198,161,91,0.55)); }
    100%{ transform:scale(1); filter:drop-shadow(0 0 8px rgba(198,161,91,0.22)); }
  }

  /* "Click" flourish — a gold ring + spark timed to when the wipe
     passes the padlock, which sits roughly 36% in from the left of
     this specific logo file. Adjust --lock-x if you swap the asset. */
  .lock-click{
    --lock-x:37%;
    position:absolute; left:var(--lock-x); top:50%; width:14%; aspect-ratio:1;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .lock-click::before, .lock-click::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--gold); opacity:0; transform:scale(0.5);
  }
  .lock-click::before{ animation:introRing 550ms ease-out 620ms forwards; }
  .lock-click::after{
    border:none; background:radial-gradient(circle, rgba(255,250,235,0.95) 0%, rgba(198,161,91,0) 70%);
    animation:introSpark 300ms ease-out 600ms forwards;
  }
  @keyframes introRing{ 0%{opacity:0.9; transform:scale(0.4);} 100%{opacity:0; transform:scale(2.4);} }
  @keyframes introSpark{ 0%{opacity:0; transform:scale(0.3);} 40%{opacity:1; transform:scale(1.1);} 100%{opacity:0; transform:scale(1.4);} }


  .intro-skip{
    position:absolute; right:26px; bottom:26px; background:none; border:1px solid var(--line-dark);
    color:var(--cream-faint); font-family:'Poppins',sans-serif; font-size:0.78rem; letter-spacing:0.04em;
    padding:9px 18px; border-radius:var(--radius-pill); cursor:pointer; opacity:0;
    animation:introRise 400ms ease-out 500ms forwards;
    transition:border-color .3s ease, color .3s ease;
  }
  .intro-skip:hover{ border-color:var(--gold); color:var(--gold); }

  /* Skip: collapse every delay/duration so fill-mode:forwards snaps to end state */
  .intro-overlay.skip, .intro-overlay.skip *{
    animation-duration:1ms !important; animation-delay:0s !important;
  }
  @media (prefers-reduced-motion: reduce){
    .intro-overlay *{ animation-duration:1ms !important; animation-delay:0s !important; }
    .intro-overlay{ animation-delay:400ms !important; }
  }

  /* demo-page-only styling below this line — not part of the component */
  .demo-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:#F5EFE2; color:#1C0E12; }
</style>
</head>

<script>
  // Intro sequence: lock body scroll while it plays, allow skipping, clean up after.
  (function(){
    var overlay = document.getElementById('introOverlay');
    var skipBtn = document.getElementById('introSkip');
    if(!overlay) return;

    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var TOTAL_MS = reduced ? 900 : 3300;

    document.documentElement.classList.add('intro-lock');

    function finish(){
      document.documentElement.classList.remove('intro-lock');
      if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
    }
    function skip(){
      overlay.classList.add('skip');
      setTimeout(finish, 120);
    }

    if (skipBtn) skipBtn.addEventListener('click', skip);
    overlay.addEventListener('click', function(e){ if(e.target === overlay) skip(); });

    setTimeout(finish, TOTAL_MS);
  })();
</script>
